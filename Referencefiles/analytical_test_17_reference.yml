reference_id: analytical_test_17_reference
wav_file: analytical_test_17_reference.wav

software:
  brt_version: "3.0.7"
  berta_renderer_version: "3.13.0"

audio:
  sample_rate: 48000
  frame_size: 512
  duration_seconds: 1.0

recording:
  command: "/recordIR"
  type: "wav"
  period_samples: 0
  delay_samples: 0
  impulse_position:
    x: 0.35
    y: 0.35
    z: 0.0

models:
  - id: ISM
    type: ISMEnvironmentModel
    enabled: true
    parameters:
      reverb_path: true
      reflexion_order: 3
      Max_distance_S-L: 10000
      
  - id: DirectPath
    type: ListenerDirectHRTFConvolutionModel
    enabled: false
    parameters:
      spatialization: true
      interpolation: true
      near_field_effect: true
      parallax_correction: true
      itd_simulation: true
      

resources:
  hrtf:
    id: HRTF1
    file: "resources//HRTF//3DTI_HRTF_SADIE_II_D2_256s_48000Hz_resampled5.sofa"
    spatial_resolution: 5
  filter:
    id: DefaultNFFilters
    file: "resources//Filters//NearFieldCompensation_ILD_1.2m_48Khz.sofa" 
  room
    id: Room1
    length: 3
    width: 5.5
    height: 3
    attenuation: 0.1

